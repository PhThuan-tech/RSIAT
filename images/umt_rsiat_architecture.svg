<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc và luồng hoạt động UMT-RSIAT</title>
  <desc id="desc">Luồng từ dữ liệu task hiện tại qua teacher và student, weakly nonlinear projector, moment alignment, adaptive top-K separation, transport thống kê và classifier alignment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#10223f"/>
    </linearGradient>
    <linearGradient id="projector" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="stats" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5eead4"/>
    </marker>
    <style>
      .title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#a5b4fc}
      .phase{font:700 17px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.2px;fill:#93c5fd}
      .boxTitle{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .body{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe}
      .small{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#bfdbfe}
      .formula{font:500 15px Consolas,Menlo,monospace;fill:#e0e7ff}
      .tag{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#071426}
      .note{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#fde68a}
      .arrow{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .arrowGreen{stroke:#5eead4;stroke-width:3;fill:none;marker-end:url(#arrowGreen)}
      .dash{stroke-dasharray:9 8}
    </style>
  </defs>

  <rect width="1600" height="920" rx="28" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="180" fill="#4f46e5" opacity="0.08"/>
  <circle cx="120" cy="850" r="220" fill="#14b8a6" opacity="0.06"/>

  <text x="70" y="68" class="title">UMT-RSIAT: Moment-aware Feature-Space Transport</text>
  <text x="70" y="102" class="subtitle">Weakly nonlinear projector + adaptive top-K separation cho class-incremental learning</text>

  <text x="70" y="150" class="phase">A · HỌC TASK t</text>
  <rect x="65" y="172" width="190" height="150" rx="20" fill="#172554" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="88" y="194" width="48" height="48" rx="10" fill="#2563eb"/>
  <rect x="145" y="194" width="48" height="48" rx="10" fill="#7c3aed"/>
  <rect x="116" y="250" width="48" height="48" rx="10" fill="#0d9488"/>
  <text x="160" y="286" class="boxTitle" text-anchor="middle">Dữ liệu task t</text>
  <text x="160" y="309" class="small" text-anchor="middle">chỉ chứa lớp mới</text>

  <path d="M255 247 H310" class="arrow"/>
  <rect x="310" y="162" width="285" height="170" rx="20" fill="#111d35" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="452" y="194" class="boxTitle" text-anchor="middle">Hai không gian đặc trưng</text>
  <rect x="334" y="212" width="237" height="42" rx="10" fill="#334155"/>
  <text x="452" y="238" class="body" text-anchor="middle">Teacher f(t−1) đóng băng → z_old</text>
  <rect x="334" y="266" width="237" height="42" rx="10" fill="#1e40af"/>
  <text x="452" y="292" class="body" text-anchor="middle">Current adapter f(t) → z_new</text>

  <path d="M595 247 H650" class="arrow"/>
  <rect x="650" y="152" width="340" height="190" rx="22" fill="url(#projector)" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="187" class="boxTitle" text-anchor="middle">Weakly nonlinear projector P(t)</text>
  <text x="820" y="220" class="formula" text-anchor="middle">P(z) = z + α·U(Vz) + β·W₂ GELU(W₁z)</text>
  <text x="820" y="250" class="small" text-anchor="middle">rank 16 · hidden 64 · identity initialization</text>
  <text x="820" y="278" class="body" text-anchor="middle">Ánh xạ z_old → không gian z_new</text>
  <rect x="728" y="298" width="184" height="27" rx="13" fill="#ddd6fe"/>
  <text x="820" y="317" class="tag" text-anchor="middle">RESET MỖI TRANSITION</text>

  <path d="M990 247 H1045" class="arrow"/>
  <rect x="1045" y="152" width="480" height="190" rx="22" fill="#111d35" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="1285" y="187" class="boxTitle" text-anchor="middle">Mục tiêu tối ưu có cấu trúc</text>
  <rect x="1070" y="207" width="205" height="103" rx="14" fill="#172554"/>
  <text x="1172" y="232" class="body" text-anchor="middle">Moment-aware alignment</text>
  <text x="1172" y="260" class="formula" text-anchor="middle">Lpoint + 0.1 Lmean</text>
  <text x="1172" y="285" class="formula" text-anchor="middle">+ 0.01 Lvariance</text>
  <rect x="1295" y="207" width="205" height="103" rx="14" fill="#312e81"/>
  <text x="1397" y="232" class="body" text-anchor="middle">Adaptive top-K</text>
  <text x="1397" y="260" class="formula" text-anchor="middle">K = 10 related old classes</text>
  <text x="1397" y="285" class="formula" text-anchor="middle">+ 0.4 Lseparation</text>

  <text x="70" y="406" class="phase">B · CẬP NHẬT BỘ NHỚ THỐNG KÊ</text>
  <rect x="65" y="430" width="330" height="175" rx="22" fill="#111d35" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="466" class="boxTitle" text-anchor="middle">Old Gaussian bank</text>
  <text x="230" y="500" class="formula" text-anchor="middle">{ μ₁, diag(σ₁²), …, μC, diag(σC²) }</text>
  <text x="230" y="532" class="body" text-anchor="middle">Không lưu ảnh cũ</text>
  <text x="230" y="560" class="small" text-anchor="middle">compact checkpoint theo seed/task</text>
  <rect x="130" y="574" width="200" height="25" rx="12" fill="#99f6e4"/>
  <text x="230" y="592" class="tag" text-anchor="middle">DIAGONAL STATISTICS</text>

  <path d="M395 516 H480" class="arrowGreen"/>
  <rect x="480" y="420" width="370" height="195" rx="22" fill="url(#stats)" stroke="#5eead4" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="458" class="boxTitle" text-anchor="middle">Statistics transport qua P(t)</text>
  <text x="665" y="490" class="body" text-anchor="middle">Lấy 128 Monte Carlo samples / lớp cũ</text>
  <text x="665" y="522" class="formula" text-anchor="middle">x ~ N(μc, diag(σc²)) → P(t)(x)</text>
  <text x="665" y="552" class="body" text-anchor="middle">Ước lượng lại μ′c và diag(σ′c²)</text>
  <text x="665" y="582" class="small" text-anchor="middle">đưa prototype cũ sang feature space mới</text>

  <path d="M850 516 H935" class="arrowGreen"/>
  <rect x="935" y="430" width="260" height="175" rx="22" fill="#111d35" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="466" class="boxTitle" text-anchor="middle">Thống kê lớp mới</text>
  <text x="1065" y="500" class="body" text-anchor="middle">Ước lượng trực tiếp từ z_new</text>
  <text x="1065" y="532" class="formula" text-anchor="middle">μnew , diag(σnew²)</text>
  <text x="1065" y="565" class="small" text-anchor="middle">ghép vào Gaussian bank</text>

  <path d="M1195 516 H1260" class="arrowGreen"/>
  <rect x="1260" y="420" width="265" height="195" rx="22" fill="#111d35" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="1392" y="458" class="boxTitle" text-anchor="middle">Classifier alignment</text>
  <text x="1392" y="490" class="body" text-anchor="middle">Sinh pseudo-features Gaussian</text>
  <text x="1392" y="522" class="body" text-anchor="middle">old + new classes</text>
  <text x="1392" y="554" class="formula" text-anchor="middle">cosine classifier · 10 epochs</text>
  <text x="1392" y="584" class="small" text-anchor="middle">giảm bias về lớp mới</text>

  <path d="M820 342 V390 H665 V420" class="arrowGreen dash"/>
  <text x="790" y="382" class="small" text-anchor="end">P(t) chỉ phục vụ transition</text>

  <text x="70" y="674" class="phase">C · SUY LUẬN VÀ CHUYỂN SANG TASK t+1</text>
  <rect x="65" y="700" width="445" height="140" rx="22" fill="#111d35" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="287" y="738" class="boxTitle" text-anchor="middle">Inference path gọn</text>
  <text x="287" y="774" class="formula" text-anchor="middle">image → current ViT adapter → cosine classifier</text>
  <text x="287" y="807" class="note" text-anchor="middle">Không cần projector tại inference</text>

  <path d="M510 770 H600" class="arrow"/>
  <rect x="600" y="700" width="400" height="140" rx="22" fill="#111d35" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="738" class="boxTitle" text-anchor="middle">Checkpoint task t</text>
  <text x="800" y="772" class="body" text-anchor="middle">network · classifier · diagonal statistics</text>
  <text x="800" y="805" class="small" text-anchor="middle">resume an toàn trên Colab / Kaggle</text>

  <path d="M1000 770 H1090" class="arrow"/>
  <rect x="1090" y="700" width="435" height="140" rx="22" fill="#111d35" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
  <text x="1307" y="738" class="boxTitle" text-anchor="middle">Task t+1</text>
  <text x="1307" y="772" class="body" text-anchor="middle">đóng băng bản t làm teacher</text>
  <text x="1307" y="805" class="small" text-anchor="middle">tạo projector identity mới và lặp lại chu trình</text>

  <text x="800" y="884" class="small" text-anchor="middle">UMT-RSIAT research pipeline · projector/moment/top-K là train-time mechanisms · CIFAR-100 B0I10</text>
</svg>
